name: DevSecOps Pipeline

on:
  push:
    branches:
      - Parameter
  pull_request:
  workflow_dispatch:
    inputs:
      key_vault_name:
        description: 'Azure Key Vault Name'
        required: true
        type: string
      azure_resource_group:
        description: 'Azure Resource Group'
        required: true
        type: string
      secrets_filter:
        description: 'Secrets Filter (e.g., *)'
        required: false
        type: string

permissions:
  id-token: write  # Required for OIDC authentication
  contents: read

jobs:

  # ✅ Step 1: Azure Login (Required for authentication)
  azure-login:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}  # Ensure this exists in GitHub Secrets

  # ✅ Step 2: Collect Metadata (Runs after login)
  collect-metadata:
    needs: azure-login
    uses: DHEEMAN2912/Reusable-Pipelines/.github/workflows/collect-metadata.yaml@main

name: DevSecOps Pipeline

on:
  push:
    branches:
      - Parameter
  pull_request:
  workflow_dispatch:

jobs:
  collect-metadata:
    uses: DHEEMAN2912/Reusable-Pipelines/.github/workflows/collect-metadata.yaml@main
  fetch-secret:
    needs: collect-metadata
    uses: DHEEMAN2912/Reusable-Pipelines/.github/workflows/Azure_Key_Vault.yaml@main
    with:
      azure_subscription: ${{ github.event.inputs.azure_subscription }}
      key_vault_name: ${{ github.event.inputs.key_vault_name }}
      azure_resource_group: ${{ github.event.inputs.azure_resource_group }}
      secrets_filter: ${{ github.event.inputs.secrets_filter }}
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
